[project]
name = "rav-interface"
version = "0.1.0"
description = "The wire contract between System 1 and System 2: types and tool names, no heavy dependencies."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rav_interface"]
