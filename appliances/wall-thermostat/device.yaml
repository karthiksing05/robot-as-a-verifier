# HT-20 room thermostat on its DS-1 desk stand (docs/device-authoring.md, docs/device-briefs.md section 3). Sim truth:
# the loader, the answer key and evaluation read this file, and no model ever does. Lengths mm, angles deg, in the
# product frame: origin on the base's bottom face, +X toward the arm, +Z up. Numbers come from cad/model.py.
# The one vertical control face in the set: the buttons and display look along +X, straight at the arm.
name: ht20
meta: {title: "HT-20 room thermostat", split: dev, project: wall-thermostat}

# A vertical face is pressed with the tool level, and the SO-101 can only hold its tool level far out and high up: at
# the centrifuge's placement (face 220 mm from the pan axis, buttons 24 mm above it) no tilt up to 20 deg reaches. So the
# face stays vertical, the buttons sit high on it (product z 116, 58 mm above the pan axis), and the stand is 110 mm
# farther out than the centrifuge's: the buttons are 330 mm out, and press's approach pose, 30 mm nearer the arm, is
# 300 mm out. A level tool reaches from about 290 to 340 mm out at that height. A higher stand board (tried: 120 mm)
# puts the board's top in the wrist camera's way.
placement: {x: 423.3, y: 0.0, yaw: 180.0}
stand_mm: 82
mounts: {thermostat: clamped}

meshes: build/meshes_rev{rev}

# Each fault is one broken property on one piece (docs/device-theory.md). F2, F3 and F4 live in the firmware: their
# fw_* params are the whole firmware strings each revision uses, and the loader substitutes them into `firmware`.
faults:
  F1: {what: "DOWN button binds in its bezel and never closes its switch, so the setpoint can't be lowered", class: mechanical,
       piece: button_2, property: actuates,
       A: {parts: {bezel_down: bezel_down_revA}, params: {cap_down_travel: 0.1}},
       B: {parts: {bezel_down: bezel_down_revB}, params: {cap_down_travel: 0.3}}}
  F2: {what: "UP at 30.0 C wraps the setpoint round to 10.0 C instead of staying at 30.0", class: firmware,
       piece: button_3, property: respects_range,
       A: {params: {fw_up: "setpoint + 5 - 205 * (setpoint >= 300)"}},
       B: {params: {fw_up: "min(setpoint + 5, 300)"}}}
  F3: {what: "MODE goes HEAT to OFF, skipping COOL", class: firmware, piece: button_1, property: matches_manual,
       A: {params: {fw_after_heat: standby, fw_after_heat_mode: "OFF"}},
       B: {params: {fw_after_heat: cool, fw_after_heat_mode: COOL}}}
  F4: {what: "in COOL the display shows the setpoint in Fahrenheit (e.g. 68.0F), where the manual says Celsius", class: manual,
       piece: display_1, property: displays_matches, masked_by: [F3],
       A: {params: {fw_cool_lcd: "{mode} {(setpoint*9+1600)//50}.{(setpoint*9+1600)//5%10}F"}},
       B: {params: {fw_cool_lcd: "{mode} {setpoint//10}.{setpoint%10}C"}}}
revs:
  A: {F1: A, F2: A, F3: A, F4: A}
  B: {F1: B, F2: B, F3: B, F4: B}
  M1: {F1: A, F2: A, F3: B, F4: A}   # MODE fixed alone: COOL can now be reached, which unmasks the Fahrenheit display

roots:
  thermostat:
    mass_kg: 0.6
    parts: [base_plate, wall_panel, gusset_L, gusset_R, housing, bezel_mode, bezel_up, $bezel_down]
    visual_only: [display_frame, ref_pico, ref_lcd_module, ref_switches, ref_status_led]

# The three caps: 10 mm across, 2.5 mm proud of the face, each on a slide along -X (into the face).
bodies:
  - {name: cap_mode, root: thermostat, parts: [cap_mode], joint: {type: slide, axis: [-1, 0, 0], anchor: [54.5, -25, 116], range: [0, 0.3], stiffness: 2000, preload_n: 2.0, damping: 2, frictionloss: 0.05, armature: 0.2}}
  - {name: cap_down, root: thermostat, parts: [cap_down], joint: {type: slide, axis: [-1, 0, 0], anchor: [54.5, 0, 116], range: [0, $cap_down_travel], stiffness: 2000, preload_n: 2.0, damping: 2, frictionloss: 0.05, armature: 0.2}}
  - {name: cap_up, root: thermostat, parts: [cap_up], joint: {type: slide, axis: [-1, 0, 0], anchor: [54.5, 25, 116], range: [0, 0.3], stiffness: 2000, preload_n: 2.0, damping: 2, frictionloss: 0.05, armature: 0.2}}

# The buttons run along the top of the face, and the LCD sits in its window below them. The status light is a lens
# on the housing's top edge.
display: {root: thermostat, centre: [52.0, 0, 88.0], normal: [1, 0, 0], up: [0, 0, 1], size: [44.0, 16.0]}
light: {root: thermostat, centre: [40.0, 0, 128.5], radius: 5, colours: {"off": [0.1, 0.1, 0.1, 1], orange: [0.98, 0.5, 0.08, 1], blue: [0.1, 0.3, 0.95, 1]}}

controls:
  - {id: button_1, kind: button, body: cap_mode, top: [54.5, -25, 116], normal: [1, 0, 0], x: [0, 1, 0], size: [10, 10, 2.5], radius: 5.0, travel: 0.3, switch_at: 0.67}
  - {id: button_2, kind: button, body: cap_down, top: [54.5, 0, 116], normal: [1, 0, 0], x: [0, 1, 0], size: [10, 10, 2.5], radius: 5.0, travel: 0.3, switch_at: 0.67}
  - {id: button_3, kind: button, body: cap_up, top: [54.5, 25, 116], normal: [1, 0, 0], x: [0, 1, 0], size: [10, 10, 2.5], radius: 5.0, travel: 0.3, switch_at: 0.67}
  - {id: display_1, root: thermostat, kind: display, pos: [52.0, 0, 88.0], normal: [1, 0, 0], x: [0, 1, 0], size: [44, 16, 0.5]}

# Faces the probe touches to find where the stand really is: the housing's front face, either side of the button row
# (high on the face, where a level tool reaches).
registration:
  thermostat:
    touches:
      - {at: [52.0, -42.0, 116.0], normal: [1, 0, 0]}
      - {at: [52.0, 42.0, 116.0], normal: [1, 0, 0]}

# The Pico's firmware, as data. Channel names are its serial events (wiring.md). setpoint is in tenths of a degree C.
# No power switch: it starts in standby (mode OFF) at 20.0 C every time it's powered.
firmware:
  channels: {btn_mode: 0, btn_down: 0, btn_up: 0, setpoint: 200, mode: "OFF"}
  sensors:
    - {channel: btn_mode, joint: cap_mode, when: "q >= 0.0002"}
    - {channel: btn_down, joint: cap_down, when: "q >= 0.0002"}
    - {channel: btn_up, joint: cap_up, when: "q >= 0.0002"}
  states:
    standby:
      show: {lcd: "{mode} {setpoint//10}.{setpoint%10}C", ring: "off"}
    heat:
      show: {lcd: "{mode} {setpoint//10}.{setpoint%10}C", ring: orange}
    cool:
      show: {lcd: $fw_cool_lcd, ring: blue}
  start: standby
  transitions:
    - {from: standby, event: btn_mode, when: "btn_mode == 1", to: heat, do: {mode: HEAT}}
    - {from: heat, event: btn_mode, when: "btn_mode == 1", to: $fw_after_heat, do: {mode: $fw_after_heat_mode}}
    - {from: cool, event: btn_mode, when: "btn_mode == 1", to: standby, do: {mode: "OFF"}}
    # UP and DOWN work in every mode, half a degree a press, clamped to 10.0-30.0 C
    - {from: standby, event: btn_up, when: "btn_up == 1", to: standby, do: {setpoint: $fw_up}}
    - {from: heat, event: btn_up, when: "btn_up == 1", to: heat, do: {setpoint: $fw_up}}
    - {from: cool, event: btn_up, when: "btn_up == 1", to: cool, do: {setpoint: $fw_up}}
    - {from: standby, event: btn_down, when: "btn_down == 1", to: standby, do: {setpoint: "max(setpoint - 5, 100)"}}
    - {from: heat, event: btn_down, when: "btn_down == 1", to: heat, do: {setpoint: "max(setpoint - 5, 100)"}}
    - {from: cool, event: btn_down, when: "btn_down == 1", to: cool, do: {setpoint: "max(setpoint - 5, 100)"}}
