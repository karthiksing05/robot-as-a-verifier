# MC-6 mini centrifuge and MC-R4 rack, for the sim. Sim truth: the loader and the answer key read this, the model never
# does. Lengths mm, angles deg, in the product frame: origin on the base's bottom face, +X toward the arm, +Z up.
# Numbers come from the CAD package's features.json, MATES.md, PARAMS.csv and wiring.md.
name: mc6

# Where the product sits. The CAD places the arm's pan axis at product (274.5, 0, 58). In the sim's arm frame the pan axis
# is at x = 38.8, and the product faces the arm, so yaw is 180.
placement: {x: 313.3, y: 0.0, yaw: 180.0}
# The sim's arm stands 140 mm above its desk, and the CAD expects 58: this board on the desk makes up the 82 mm.
stand_mm: 82
mounts: {centrifuge: clamped, rack: clamped}   # clamped: fixed to the bench. free: friction on the bench only

meshes: sim/meshes_rev{rev}
# The three faults are part swaps: each choice picks its parts' meshes and parameters.
faults:
  F1: {what: "Stop button binds in its bezel", A: {parts: {bezel_stop: bezel_stop_revA}, params: {cap_stop_travel: 0.1}}, B: {parts: {bezel_stop: bezel_stop_revB}, params: {cap_stop_travel: 0.3}}}
  F2: {what: "lid handle has a pinch fin, no hook lip", A: {parts: {lid_handle: lid_handle_revA}, params: {lid_grip: pinch}}, B: {parts: {lid_handle: lid_handle_revB}, params: {lid_grip: tip}}}
  F3: {what: "well A insert is too tight, so the tube sits high", A: {parts: {well_insert: well_insert_A_revA}, params: {well_a_id: 15.6}}, B: {parts: {well_insert: well_insert_A_revB}, params: {well_a_id: 16.8}}}
revs:
  A: {F1: A, F2: A, F3: A}
  B: {F1: B, F2: B, F3: B}

materials: {plywood: {density: 600}, acrylic: {density: 1190}, pla: {density: 1240}}

roots:
  centrifuge:
    mass_kg: 0.75
    parts: [base_plate, front_panel, control_face, side_panel_L, side_panel_R, top_panel, rotor_plate, lid_hinge_base,
            $bezel_stop, $well_insert]
    visual_only: [gusset_L, gusset_R, ref_ring]
    arm_only: [top_panel, rotor_plate, well_insert_A_revA, well_insert_A_revB]
    rings:
      - {centre: [-21, -13], id: $well_a_id, z: [52.0, 60.7]}
      - {centre: [-21, 13], id: 16.8, z: [56.1, 59.1]}
  rack:
    mass_kg: 0.2
    parts: [rack_base, rack_middle, rack_top, rack_back_strip, rack_end_L, rack_end_R, rack_hinge_base]
    arm_only: [rack_middle, rack_top]
    rings:
      - {centre: [100.0, 193.42], id: 16.8, z: [49.4, 52.4]}
      - {centre: [84.57, 175.03], id: 16.8, z: [49.4, 52.4]}
      - {centre: [69.15, 156.65], id: 16.8, z: [49.4, 52.4]}
      - {centre: [53.72, 138.26], id: 16.8, z: [49.4, 52.4]}

bodies:
  - {name: cap_start, root: centrifuge, parts: [cap_start], joint: {type: slide, axis: [-0.7071, 0, -0.7071], anchor: [44.27, -22.86, 78.27], range: [0, 0.3], stiffness: 2000, preload_n: 2.0, damping: 2, frictionloss: 0.05, armature: 0.2}}
  - {name: cap_stop, root: centrifuge, parts: [cap_stop], joint: {type: slide, axis: [-0.7071, 0, -0.7071], anchor: [45.68, 0, 79.68], range: [0, $cap_stop_travel], stiffness: 2000, preload_n: 2.0, damping: 2, frictionloss: 0.05, armature: 0.2}}
  - {name: cap_time, root: centrifuge, parts: [cap_time], joint: {type: slide, axis: [-0.7071, 0, -0.7071], anchor: [44.27, 22.86, 78.27], range: [0, 0.3], stiffness: 2000, preload_n: 2.0, damping: 2, frictionloss: 0.05, armature: 0.2}}
  - name: dial_knob
    root: centrifuge
    parts: [dial_knob]
    collide_geoms_only: true
    geoms:   # a 10 mm knob and its 3 mm fin, as primitives: 5 to 16 mm above the plate
      - {type: cylinder, fromto: [46.04, 50.5, 80.04, 53.81, 50.5, 87.81], radius: 5.0, mass: 0.003}
      - {type: box, pos: [52.17, 47.32, 81.67], half: [4.5, 1.5, 5.5], x: [0.5, -0.7071, -0.5], z: [0.7071, 0, 0.7071], mass: 0.001}
    # a plain potentiometer: no detents, a little friction. Clockwise from outside raises the speed: negative about +normal
    joint: {type: hinge, axis: [0.7071, 0, 0.7071], anchor: [49.93, 50.5, 83.93], range: [-270, 0], damping: 0.002, frictionloss: 0.004, armature: 0.0005}
  - name: power_lever
    root: centrifuge
    # the lever is a placeholder inside ref_toggle in the CAD, so it's drawn here: 10 mm from a pivot 6 mm above the plate,
    # leaning 15 deg to the bottom edge (off). q is 0 there and 30 deg against the top edge (on)
    geoms:
      - {type: capsule, fromto: [46.74, -50.5, 80.74, 55.4, -50.5, 85.74], radius: 1.5, rgba: [0.75, 0.75, 0.78, 1], mass: 0.002}
    joint: {type: hinge, axis: [0, -1, 0], anchor: [46.74, -50.5, 80.74], range: [0, 30], damping: 0.002, armature: 0.0002}
    snap: {nm: 0.012, centre_deg: 15}
  - name: lid
    root: centrifuge
    parts: [lid, lid_hinge_leaf, $lid_handle, lid_sensor_fin]
    joint: {type: hinge, axis: [0, -1, 0], anchor: [-56.5, 0, 102.0], range: [0, 105], damping: 0.02, frictionloss: 0.002, armature: 0.001, mass: 0.06}
  - name: rack_cover
    root: rack
    parts: [rack_cover, rack_hinge_leaf, rack_cover_lip]
    joint: {type: hinge, axis: [-0.64, -0.77, 0], anchor: [60.39, 179.66, 86.2], range: [0, 105], damping: 0.02, frictionloss: 0.002, armature: 0.001, mass: 0.05}

# Loose things on the bench. They start where the CAD's full rig has them.
objects:
  - name: tube_1
    part: tube_2
    root: rack
    mass_kg: 0.008
    rgba: [0.92, 0.92, 0.9, 1]
    collar: [84.57, 175.03, 58.0]
    collar_top: [84.57, 175.03, 61.0]
    # the tube's profile, from its top of collar down: [radius, from, to]. The long taper is what lets a tight bore stop it high
    stack: [[9.5, -6, -8.6], [8.0, -8.6, -17.0], [7.2, -17.0, -22.0], [6.0, -22.0, -28.0], [5.0, -28.0, -34.0], [4.0, -34.0, -40.0], [3.0, -40.0, -46.5], [2.0, -46.5, -55.0]]
    boxes:
      - {x: [0.77, -0.64, 0], at: [0, 0, -3.0], half: [9.0, 11.0, 3.0]}    # collar, 18 mm across its flats
      - {x: [0.77, -0.64, 0], at: [0, 0, 8.6], half: [1.5, 7.0, 7.0]}      # lifting loop

# Screen and light ring: what the firmware draws on. Positions from the OLED and ring placeholders.
display: {root: centrifuge, centre: [58.7, 0, 30.0], normal: [1, 0, 0], up: [0, 0, 1], size: [22.0, 11.0]}
light: {root: centrifuge, centre: [-21, 0, 54.0], radius: 30, colours: {"off": [0.1, 0.1, 0.1, 1], white: [0.95, 0.95, 0.95, 1], blue: [0.1, 0.3, 0.95, 1], green: [0.1, 0.85, 0.2, 1], red: [0.9, 0.1, 0.1, 1]}}

# What a scan may fail to find, as a registered inventory. Each is one part in the product frame, with the keys features.py
# asks of its kind. System 1 uses one only where its scan found nothing there, with source "cad".
controls:
  - {id: button_1, kind: button, body: cap_start, top: [44.27, -22.86, 78.27], normal: [0.7071, 0, 0.7071], x: [0, 1, 0], size: [10, 10, 2.5], radius: 5.0, travel: 0.3, switch_at: 0.67}
  - {id: button_2, kind: button, body: cap_stop, top: [45.68, 0, 79.68], normal: [0.7071, 0, 0.7071], x: [0, 1, 0], size: [10, 10, 4.5], radius: 5.0, travel: 0.3, switch_at: 0.67}
  - {id: button_3, kind: button, body: cap_time, top: [44.27, 22.86, 78.27], normal: [0.7071, 0, 0.7071], x: [0, 1, 0], size: [10, 10, 2.5], radius: 5.0, travel: 0.3, switch_at: 0.67}
  - {id: dial_1, kind: dial, body: dial_knob, top: [46.04, 50.5, 80.04], normal: [0.7071, 0, 0.7071], x: [0.5, -0.7071, -0.5], size: [18, 18, 11], knob_radius: 5.0, knob_height: 11, fin_length: 18, fin_width: 3, fin_height: 11, floor_gap: 5, one_sided: true, range_deg: [-270, 0]}
  - {id: toggle_1, kind: toggle, body: power_lever, hinge: [46.74, -50.5, 80.74], normal: [0.7071, 0, 0.7071], lean: [0.7071, 0, -0.7071], tip: [55.4, -50.5, 85.74], size: [10, 10, 11.5], lever_len: 11.5, lever_radius: 1.5, base_size: [10, 10, 3]}
  - {id: handle_1, kind: handle, body: lid, reads: true, pos: [26.0, 0, 107.0], normal: [1, 0, 0], grip: $lid_grip, pull: [-0.06, 0, 1], under: [-1, 0, 0], clear: 10, hinge: [-56.5, 0, 102.0], axis: [0, -1, 0], open_deg: 105, size: [16, 9, 10]}
  - {id: handle_2, kind: handle, body: rack_cover, pos: [102.91, 143.98, 81.2], normal: [0.77, -0.64, 0], grip: tip, pull: [0.07, -0.06, 1], under: [-0.77, 0.64, 0], clear: 3, hinge: [60.39, 179.66, 86.2], axis: [-0.64, -0.77, 0], open_deg: 105, size: [16, 9, 3]}
  - {id: display_1, root: centrifuge, kind: display, pos: [58.7, 0, 30.0], normal: [1, 0, 0], x: [0, 1, 0], size: [22, 11, 0.5]}
  - {id: well_1, root: centrifuge, kind: well, reads: true, pos: [-21, -13, 60.7], normal: [0, 0, 1], x: [1, 0, 0], size: [16.8, 16.8, 1], collar: [-21, -13, 65.3]}
  - {id: well_2, root: centrifuge, kind: well, pos: [-21, 13, 59.1], normal: [0, 0, 1], x: [1, 0, 0], size: [16.8, 16.8, 1], collar: [-21, 13, 64.68]}
  - {id: well_3, root: rack, kind: well, pos: [100.0, 193.42, 52.4], normal: [0, 0, 1], x: [0.77, -0.64, 0], size: [16.8, 16.8, 1], collar: [100.0, 193.42, 58.0]}
  - {id: well_4, root: rack, kind: well, pos: [84.57, 175.03, 52.4], normal: [0, 0, 1], x: [0.77, -0.64, 0], size: [16.8, 16.8, 1], collar: [84.57, 175.03, 58.0]}
  - {id: well_5, root: rack, kind: well, pos: [69.15, 156.65, 52.4], normal: [0, 0, 1], x: [0.77, -0.64, 0], size: [16.8, 16.8, 1], collar: [69.15, 156.65, 58.0]}
  - {id: well_6, root: rack, kind: well, pos: [53.72, 138.26, 52.4], normal: [0, 0, 1], x: [0.77, -0.64, 0], size: [16.8, 16.8, 1], collar: [53.72, 138.26, 58.0]}
  - {id: tube_1, kind: object, object: tube_1, collar_top: 0.0, jaw_axis: [0.77, -0.64, 0], flats: 18, grips: [{at: [84.57, 175.03, 69.6], axis: [0.64, 0.77, 0], width: 14, depth: 6.0}, {at: [84.57, 175.03, 69.6], axis: [0.77, -0.64, 0], width: 3, depth: 6.0}, {axis: [0.64, 0.77, 0], width: 22, depth: 1.0}, {axis: [0.77, -0.64, 0], width: 18}]}

# Faces the probe touches to find where each root really is (inventory.py). A device on a bench moves in x, y and yaw.
# Only faces toward the arm are here: the SO-101 keeps its tool in the plane through its pan axis, so a side face can
# only be met with the pad's rim, tool near vertical, and on this rig the gripper above the pad then hits the panel or
# the rack's cover (tried: side panels at z 60 and 88, rack end plates at z 25-60, the top plate's edge under the
# cover's lip). What these leave unmeasured (the centrifuge's y; the rack's y and yaw), scanned parts measure, or the
# guess stands and the report says so. Points from ray casts of the CAD, product frame.
registration:
  centrifuge:
    touches:
      - {at: [60.0, -45.0, 50.0], normal: [1, 0, 0]}     # front panel, above the display
      - {at: [60.0, 45.0, 50.0], normal: [1, 0, 0]}
  rack:
    follows: centrifuge   # nothing a scan finds is on the rack: until touched, assume it moved with the centrifuge
    touches:
      - {at: [128.96, 187.48, 25.0], normal: [0.77, -0.64, 0]}   # middle shelf's front edge: the top's is under the cover's lip

# The Pico's firmware, as data. Channel names are its serial events (wiring.md).
firmware:
  channels: {power: 0, btn_start: 0, btn_stop: 0, btn_time: 0, speed: 1000, lid: 1, tube: 0, run: idle, time: 30}
  sensors:
    - {channel: btn_start, joint: cap_start, when: "q >= 0.0002"}
    - {channel: btn_stop, joint: cap_stop, when: "q >= 0.0002"}
    - {channel: btn_time, joint: cap_time, when: "q >= 0.0002"}
    - {channel: power, joint: power_lever, when: "q > radians(15)", hysteresis: 0.05}
    - {channel: speed, joint: dial_knob, value: "1000 + 100 * round(-q / radians(270) * 50)"}
    - {channel: lid, joint: lid, when: "q < radians(2)"}
    # the tube's nub breaks a beam: seated means the body is within this box of the well (product frame, from the MOC)
    - {channel: tube, object: tube_1, root: centrifuge, near: [-21, -13, 65.3], radius_mm: 3, height_mm: 2.5}
  # when: a condition on the channels. do: assignments, in order. after: seconds in this state.
  states:
    dark:
      show: {lcd: "", ring: "off"}
    ready:
      show: {lcd: "{speed} RPM {time//60}:{time%60:02d}", ring: white}
    running:
      show: {lcd: "{speed} RPM {left//60}:{left%60:02d}", ring: blue}
    done:
      show: {lcd: "DONE", ring: green}
    refused:
      show: {lcd: "{reason}", ring: red}
  start: dark
  transitions:
    - {any: true, when: "power == 0", to: dark, do: {run: idle}}
    - {from: dark, when: "power == 1", to: ready, do: {time: 30}}
    - {from: [ready, done, refused], event: btn_time, when: "btn_time == 1 and time < 600", to: ready, do: {time: "time + 10"}}
    - {from: [ready, done, refused], event: btn_start, when: "btn_start == 1 and lid == 0", to: refused, do: {reason: "LID", run: "refused:LID"}}
    - {from: [ready, done, refused], event: btn_start, when: "btn_start == 1 and tube == 0", to: refused, do: {reason: "TUBE", run: "refused:TUBE"}}
    - {from: [ready, done, refused], event: btn_start, when: "btn_start == 1", to: running, do: {left: "time", run: start}}
    - {from: running, event: btn_stop, when: "btn_stop == 1", to: ready, do: {run: stop}}
    - {from: running, when: "left <= 0", to: done, do: {run: done}}   # left counts down by itself while running
    - {from: done, when: "lid == 0", to: ready}

# How far reposition may move the device, and where the arm pushes it from. The arm reaches only faces toward it, so it
# can push the device away along a push face's normal and no other way; reposition refuses the rest. Only a root that
# isn't clamped moves (mounts above, or the rig's mounts option).
reposition:
  dx_mm: 30
  dy_mm: 30
  yaw_deg: 0
  push:
    centrifuge: [{at: [60.0, 0.0, 50.0], normal: [1, 0, 0]}]     # the front panel's middle, above the display
    rack: [{at: [128.96, 187.48, 25.0], normal: [0.77, -0.64, 0]}]
