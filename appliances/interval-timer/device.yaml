# IT-90 lab interval timer (docs/device-authoring.md, brief 5). Sim truth: the loader, the answer key and evaluation read
# this file, and no model ever does. Lengths mm, angles deg, in the product frame: origin on the bottom face, +X toward
# the arm, +Z up. Numbers come from cad/model.py: the panel's surface is the plane x + z = 119, the control row is at
# (x, z) = (42.5, 76.5) on it, and the panel normal is (0.7071, 0, 0.7071).
name: it90
meta: {title: "IT-90 lab interval timer", split: dev, project: interval-timer}

# The centrifuge's placement: the arm's pan axis at product (274.5, 0, 58).
placement: {x: 313.3, y: 0.0, yaw: 180.0}
stand_mm: 82
mounts: {timer: clamped}

meshes: build/meshes_rev{rev}
# Each fault is one broken property on one piece (docs/device-theory.md). Firmware faults are $params in `firmware`.
faults:
  F1: {what: "+SEC adds 10 seconds per press, where the manual says 1 second", class: manual, piece: button_2, property: mapping_matches,
       A: {params: {sec_step: 10}}, B: {params: {sec_step: 1}}}
  F2: {what: "START/STOP while counting down resets the display to 00:00 instead of pausing, and resuming then ends at once with DONE",
       class: firmware, piece: button_3, property: procedure_completes,
       A: {params: {pause_keeps: 0}}, B: {params: {pause_keeps: 1}}}
  F3: {what: "+MIN's cap bottoms out on its bezel before its switch closes, so +MIN never adds a minute", class: mechanical, piece: button_1, property: actuates,
       A: {parts: {bezel_min: bezel_min_revA}, params: {min_travel: 0.1}}, B: {parts: {bezel_min: bezel_min_revB}, params: {min_travel: 0.3}}}
  F4: {what: "times of 10 minutes and over show the wrong minutes: the tens digit is dropped, so 10:00 shows 00:00", class: firmware,
       piece: display_1, property: displays_matches, masked_by: [F3],
       A: {params: {min_mod: 10}}, B: {params: {min_mod: 100}}}
revs:
  A: {F1: A, F2: A, F3: A, F4: A}
  B: {F1: B, F2: B, F3: B, F4: B}
  M1: {F1: A, F2: A, F3: B, F4: A}   # +MIN fixed alone: 10 minutes can now be set, which unmasks the display fault

materials: {pla: {density: 1240}}

roots:
  timer:
    mass_kg: 0.42
    parts: [housing, feet, display_bezel, lamp_lens, toggle_boss, $bezel_min, bezel_sec, bezel_go]
    visual_only: [label_min, label_sec, label_go, label_power, ref_pcb, ref_lcd_module, ref_toggle, ref_switches, ref_led, ref_usb]

# Caps are slides along -normal, anchored at the cap's top centre. The switch under each closes at 0.2 mm.
bodies:
  - {name: cap_min, root: timer, parts: [cap_min], joint: {type: slide, axis: [-0.7071, 0, -0.7071], anchor: [44.27, -42.0, 78.27], range: [0, $min_travel], stiffness: 2000, preload_n: 2.0, damping: 2, frictionloss: 0.05, armature: 0.2}}
  - {name: cap_sec, root: timer, parts: [cap_sec], joint: {type: slide, axis: [-0.7071, 0, -0.7071], anchor: [44.27, -20.0, 78.27], range: [0, 0.3], stiffness: 2000, preload_n: 2.0, damping: 2, frictionloss: 0.05, armature: 0.2}}
  - {name: cap_go, root: timer, parts: [cap_go], joint: {type: slide, axis: [-0.7071, 0, -0.7071], anchor: [44.97, 8.0, 78.97], range: [0, 0.3], stiffness: 2000, preload_n: 2.0, damping: 2, frictionloss: 0.05, armature: 0.2}}
  - name: power_lever
    root: timer
    # 10 mm lever from a pivot 6 mm above the panel, leaning 15 deg toward the panel's bottom edge (off, q = 0); 30 deg is on
    geoms:
      - {type: capsule, fromto: [46.74, 44.0, 80.74, 55.4, 44.0, 85.74], radius: 1.5, rgba: [0.75, 0.75, 0.78, 1], mass: 0.002}
    joint: {type: hinge, axis: [0, -1, 0], anchor: [46.74, 44.0, 80.74], range: [0, 30], damping: 0.002, armature: 0.0002}
    snap: {nm: 0.012, centre_deg: 15}

# The LCD in the front face's bezel window, and the status lamp under the lens on top.
display: {root: timer, centre: [60.0, 0, 40.0], normal: [1, 0, 0], up: [0, 0, 1], size: [44.0, 16.0]}
light: {root: timer, centre: [-18, 0, 106.6], radius: 7, colours: {"off": [0.1, 0.1, 0.1, 1], blue: [0.1, 0.3, 0.95, 1], green: [0.1, 0.85, 0.2, 1]}}

controls:
  - {id: button_1, kind: button, body: cap_min, top: [44.27, -42.0, 78.27], normal: [0.7071, 0, 0.7071], x: [0, 1, 0], size: [10, 10, 2.5], radius: 5.0, travel: 0.3, switch_at: 0.67}
  - {id: button_2, kind: button, body: cap_sec, top: [44.27, -20.0, 78.27], normal: [0.7071, 0, 0.7071], x: [0, 1, 0], size: [10, 10, 2.5], radius: 5.0, travel: 0.3, switch_at: 0.67}
  - {id: button_3, kind: button, body: cap_go, top: [44.97, 8.0, 78.97], normal: [0.7071, 0, 0.7071], x: [0, 1, 0], size: [14, 14, 3.5], radius: 7.0, travel: 0.3, switch_at: 0.67}
  - {id: toggle_1, kind: toggle, body: power_lever, hinge: [46.74, 44.0, 80.74], normal: [0.7071, 0, 0.7071], lean: [0.7071, 0, -0.7071], tip: [55.4, 44.0, 85.74], size: [10, 10, 11.5], lever_len: 11.5, lever_radius: 1.5, base_size: [10, 10, 3]}
  - {id: display_1, root: timer, kind: display, pos: [60.0, 0, 40.0], normal: [1, 0, 0], x: [0, 1, 0], size: [44, 16, 0.5]}

# The front face either side of the display bezel (which spans y -27 to 27, z 28 to 52).
registration:
  timer:
    touches:
      - {at: [60.0, -45.0, 40.0], normal: [1, 0, 0]}
      - {at: [60.0, 45.0, 40.0], normal: [1, 0, 0]}

# The firmware, as data. Channel names are its serial events (wiring.md). `time` is the set time in seconds; `left`, the
# countdown, is a variable that the `running` state counts down by itself.
firmware:
  channels: {power: 0, btn_min: 0, btn_sec: 0, btn_go: 0, time: 0, run: idle}
  sensors:
    - {channel: btn_min, joint: cap_min, when: "q >= 0.0002"}
    - {channel: btn_sec, joint: cap_sec, when: "q >= 0.0002"}
    - {channel: btn_go, joint: cap_go, when: "q >= 0.0002"}
    - {channel: power, joint: power_lever, when: "q > radians(15)", hysteresis: 0.05}
  # MM:SS. -(-left//1) is left rounded up to a whole second
  states:
    dark:
      show: {lcd: "", ring: "off"}
    ready:
      show: {lcd: "{time//60%$min_mod:02d}:{time%60:02d}", ring: "off"}
    running:
      show: {lcd: "{-(-left//1)//60%$min_mod:02d}:{-(-left//1)%60:02d}", ring: blue}
    paused:
      show: {lcd: "{-(-left//1)//60%$min_mod:02d}:{-(-left//1)%60:02d}", ring: "off"}
    done:
      show: {lcd: "DONE", ring: green}
  start: dark
  transitions:
    - {any: true, when: "power == 0", to: dark, do: {run: idle, time: 0}}
    - {from: dark, when: "power == 1", to: ready, do: {time: 0}}
    - {from: ready, event: btn_min, when: "btn_min == 1 and time + 60 <= 5999", to: ready, do: {time: "time + 60"}}
    - {from: ready, event: btn_sec, when: "btn_sec == 1 and time + $sec_step <= 5999", to: ready, do: {time: "time + $sec_step"}}
    - {from: ready, event: btn_go, when: "btn_go == 1 and time > 0", to: running, do: {left: "time", run: start}}
    - {from: running, when: "left <= 0", to: done, do: {run: done}}
    - {from: running, event: btn_go, when: "btn_go == 1", to: paused, do: {left: "left * $pause_keeps", run: pause}}
    - {from: paused, event: btn_go, when: "btn_go == 1", to: running, do: {run: resume}}
    - {from: done, event: btn_go, when: "btn_go == 1", to: ready, do: {run: idle}}
