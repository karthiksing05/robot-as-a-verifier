[project]
name = "rav-contracts"
version = "0.1.0"
description = "The objects only System 2 uses: run events, findings, fixes, reports."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "rav-interface"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rav_contracts"]
