[project]
name = "rav-harness"
version = "0.1.0"
description = "Runs a test through System 1's tools: planning, steering, reward, report, fix loop."
requires-python = ">=3.12"
dependencies = ["rav-contracts", "rav-cad", "mcp>=2.3,<3", "httpx2", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rav_harness"]

[project.scripts]
rav = "rav_harness.cli:main"
rav-agent = "rav_harness.service:main"

[tool.uv.sources]
rav-contracts = { workspace = true }
rav-cad = { workspace = true }
