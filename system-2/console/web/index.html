<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAV Console</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231e2226'/%3E%3Cpath d='M3 12 L8 4 L13 12' fill='none' stroke='%23e3ae3c' stroke-width='2'/%3E%3C/svg%3E" />
    <script>
      // Runs before first paint so the app never flashes the wrong theme or a white page.
      (function () {
        var theme = "dark";
        try {
          theme = localStorage.getItem("rav.theme") || theme;
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      html { background: #1e2226; }
      html[data-theme="light"] { background: #e6e6e2; }
      body { margin: 0; }
      #root { opacity: 0; }
      html.ready #root { opacity: 1; transition: opacity 260ms cubic-bezier(0.2, 0.8, 0.2, 1); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
