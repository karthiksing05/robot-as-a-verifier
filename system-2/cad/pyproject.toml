[project]
name = "rav-cad"
version = "0.1.0"
description = "Applies and checks CAD parameter patches: params file, CadQuery, or a CAD MCP server."
requires-python = ">=3.12"
dependencies = ["rav-contracts"]

[project.optional-dependencies]
# The CadQuery backend (rav_cad.parametric). The root workspace's `cad` extra installs the same set.
cadquery = ["cadquery==2.8.0", "pyyaml", "numpy", "matplotlib"]
# The Onshape backend (rav_cad.onshape). httpx2 is the httpx fork that mcp 2.x uses; the harness pins it too.
onshape = ["httpx2", "mcp>=2.3,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rav_cad"]

[tool.uv.sources]
rav-contracts = { workspace = true }
